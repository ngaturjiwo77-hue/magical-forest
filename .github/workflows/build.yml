name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential libltdl-dev libffi-dev libssl-dev \
            python3-dev python3-pip python3-setuptools python3-venv \
            zip unzip autoconf libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev cmake

      - name: Install Buildozer
        run: |
          pip3 install --user --upgrade buildozer "cython==0.29.33"

      - name: Build APK
        run: |
          export PATH=$PATH:~/.local/bin
          # Hapus semua sisa build sebelumnya secara paksa
          rm -rf .buildozer
          buildozer android debug 2>&1 | tee buildozer_log.txt

      - name: Upload Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Build-Logs
          path: buildozer_log.txt

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MagicalForest-APK
          path: bin/*.apk
