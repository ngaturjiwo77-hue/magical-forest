name: Build Kivy APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: kivy/buildozer:latest
    steps:
      - uses: actions/checkout@v4

      - name: Build APK
        run: |
          buildozer android debug
        env:
          # Kunci rahasia untuk melewati proteksi root
          BUILDOZER_ALLOW_ROOT: 1
          # Memastikan Buildozer tahu di mana folder home-nya
          HOME: /home/user

      - uses: actions/upload-artifact@v4
        with:
          name: MagicalForest-APK
          path: bin/*.apk
