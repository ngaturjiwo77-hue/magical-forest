name: Build Kivy APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip git zip unzip openjdk-17-jdk python3-venv autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libffi-dev libssl-dev cmake m4 automake

      - name: Setup Android SDK
        run: |
          # Download SDK Command Line Tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip -d cmdline-tools
          
          # Setup Folder Structure
          mkdir -p android-sdk/cmdline-tools
          mv cmdline-tools/cmdline-tools android-sdk/cmdline-tools/latest
          
          # Set Environment Variable
          echo "ANDROID_HOME=$GITHUB_WORKSPACE/android-sdk" >> $GITHUB_ENV
          
          # Install SDK using Absolute Path (Penting: Panggil langsung filenya!)
          # Menjawab lisensi SDK secara otomatis
          yes | $GITHUB_WORKSPACE/android-sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root=$GITHUB_WORKSPACE/android-sdk "platform-tools" "platforms;android-33" "build-tools;34.0.0"

      - name: Build APK
        run: |
          pip3 install --user --upgrade buildozer
          export PATH=$PATH:~/.local/bin
          export ANDROID_HOME=$GITHUB_WORKSPACE/android-sdk
          # Buildozer akan mendeteksi SDK di path yang sudah kita buat
          buildozer android debug

      - uses: actions/upload-artifact@v4
        with:
          name: MagicalForest-APK
          path: bin/*.apk
